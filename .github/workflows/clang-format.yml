name: Clang Format

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'devel/**'
      - 'copilot/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install clang-format
        # Pinned rather than `apt-get install`, which floats to whatever
        # version the runner image ships - that drifted from contributors'
        # local versions and produced conflicting reformats (see PR #4965).
        # Version matches flatcap's own local clang-format.
        run: pip install clang-format==22.1.8

      - name: Check formatting
        run: |
          # Print each diff and a plain file list to the log: ::error lines
          # only show as annotations on the run summary, not in the raw log.
          FAILED=()
          while IFS= read -r file; do
            if ! clang-format -style=file "$file" | diff -u "$file" -; then
              echo "::error file=$file::needs clang-format"
              FAILED+=("$file")
            fi
          done < <(git ls-files -- ':!autosetup/' ':!docs/' '*.c')

          if [ ${#FAILED[@]} -ne 0 ]; then
            echo "These files need clang-format:"
            printf '  %s\n' "${FAILED[@]}"
            echo "Run: clang-format -style=file -i <file>"
            exit 1
          fi
